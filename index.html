<style>
:root{--bg:#fff7f4;--card:#fff;--ink:#231f20;--mute:#6b6465;--line:#ecd9d2;--acc:#ef492c;--accink:#fff;--ok:#2f6b4f;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#231f20;--card:#2f2a2b;--ink:#fff7f4;--mute:#b3a9a6;--line:#443d3e;--acc:#ef492c;--ok:#5fb98c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#231f20;--card:#2f2a2b;--ink:#fff7f4;--mute:#b3a9a6;--line:#443d3e;--acc:#ef492c;--ok:#5fb98c;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Vazirmatn',Tahoma,sans-serif;line-height:1.7}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:2.2rem;font-weight:800;margin:8px 0 4px}
h2{font-size:1.1rem;margin:0 0 10px}
p{color:var(--mute);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;background:var(--acc);color:#fff;width:100%}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}

.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper button{width:48px;padding:8px;font-size:1.4rem}
.num{font-size:2.4rem;font-weight:800}
input[type=text]{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:8px}
.names{max-height:36vh;overflow:auto}
.big{text-align:center;padding:36px 16px}
.who{font-size:1.8rem;font-weight:800;margin-bottom:8px}
.role{font-size:2.2rem;font-weight:800;color:var(--acc);margin:10px 0 4px}
.role.good{color:var(--ok)}
.pl{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line)}
.pl:last-child{border:0}
.pl.dead .nm{text-decoration:line-through;color:var(--mute)}

.tag{font-size:.85rem;color:var(--mute);margin-inline-start:8px}
.phase{display:flex;justify-content:space-between;align-items:baseline}

.win{background:var(--acc);color:#fff;text-align:center;font-size:1.3rem;font-weight:800}
.mix span{display:inline-block;margin:0 0 4px 10px;color:var(--mute);font-size:.95rem}
.step{padding:8px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step small{display:block;color:var(--mute)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bar img{width:40px;height:40px;border-radius:10px;display:block}
.gm{font-weight:800}
.hero{text-align:center;margin-bottom:8px}

ol{margin:0;padding-inline-start:20px;color:var(--mute)}
select{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{width:auto;padding:8px 16px}
.role.tc{color:var(--ok)}.role.ti{color:var(--ink)}
.gh{font-size:.85rem;color:var(--mute);font-weight:600;margin:12px 0 2px}
.rl{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.rs{display:flex;align-items:center;gap:10px}
.rs button{width:38px;padding:4px;font-size:1.2rem}
.rs b{min-width:26px;text-align:center}
.tot{display:flex;justify-content:space-between;font-weight:800;margin:12px 0}
.team{font-size:1.9rem;font-weight:800;margin:4px 0 14px;color:var(--acc)}

.pl>div:first-child{flex:1;min-width:0;margin-inline-end:10px}

.tmi{max-width:560px;margin:0 auto}
.tmr{display:flex;gap:8px}
.tmr button{flex:1;padding:8px 4px;margin:0}
.tt{font-size:2.6rem;font-weight:800;text-align:center;line-height:1.3;margin:2px 0 4px}
.tt.lo{color:var(--acc)}

<script>
(function(){
var K='mafia-font-css',st=document.createElement('style');
document.head.appendChild(st);
try{var c=localStorage.getItem(K);if(c){st.textContent=c;return}}catch(e){}
if(!navigator.onLine)return;
var U='https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap';
fetch(U).then(function(r){return r.text()}).then(async function(css){
 var urls=Array.from(new Set(Array.from(css.matchAll(/url\((https:[^)]+)\)/g)).map(function(m){return m[1]})));
 for(var i=0;i<urls.length;i++){
  var b=await (await fetch(urls[i])).blob();
  var d=await new Promise(function(r){var f=new FileReader();f.onload=function(){r(f.result)};f.readAsDataURL(b)});
  css=css.split(urls[i]).join(d);
 }
 st.textContent=css;
 try{localStorage.setItem(K,css)}catch(e){}
}).catch(function(){});
})();
</script>

['رای‌گیری دوم (چند نفر در دفاع)','در خواب نیمروزی و مخفی انجام می‌شود و بعد از آن شهردار بیدار می‌شود. هر بازیکن فقط به یک نفر رای می‌دهد و کسانی که در دفاع هستند حق رای ندارند. هر کس بیشترین رای را بیاورد خارج می‌شود (حدنصاب مهم نیست).'],
['رای‌گیری دوم (یک نفر در دفاع)','در روز و آشکار انجام می‌شود و شهردار بیدار نمی‌شود. برای خروج آن فرد حداقل نصف نفرات باید به او رای بدهند.'],
['قرعه مرگ','اگر دو نفر بیشترین رای برابر را بیاورند، یکی از آن‌ها با قرعه خارج می‌شود.'],
['کارت‌های حرکت آخر','بازیکنی که خارج می‌شود یک کارت انتخاب می‌کند. مسیر سبز: یک نفر آن روز متهم نمی‌شود. فرش قرمز: یک نفر حتماً به دفاعیه می‌رود. ذهن زیبا: حدس نقشی که اعلام نشده؛ اگر درست باشد به بازی برمی‌گردد. بی‌خوابی: مستقیم به روز بعد می‌رویم. سرگیجه: یک نفر برای یک روز و شب بی‌اثر می‌شود. شلیک نهایی: بعد از رای‌گیری دوم به‌جای مافیا شلیک شب را انجام می‌دهد و کامل خارج می‌شود.']
],roles:{
'پدرخوانده':'هر شب یک نفر را برای شات شب انتخاب می‌کند. اگر کارآگاه او را استعلام کند، جواب همیشه «شهروند» است.',
'جوکر':'هر شب یک نفر را انتخاب می‌کند؛ اگر کارآگاه همان شب او را استعلام کند، جواب معکوس داده می‌شود. در حالت ۱۳ نفره هر نفر را فقط یک بار می‌تواند انتخاب کند.',
'مافیای ساده':'شب همراه مافیا بیدار می‌شود و می‌تواند یک نفر را برای شات پیشنهاد بدهد؛ انتخاب نهایی با پدرخوانده است.',
'کارآگاه':'هر شب استعلام یک نفر را می‌گیرد؛ اگر از مافیا باشد، مثبت اعلام می‌شود. استعلام پدرخوانده همیشه «شهروند» است.',
'پزشک':'شب‌ها از شهروندان محافظت می‌کند. تعداد نفراتی که می‌تواند انتخاب کند به تعداد بازیکنان زنده بستگی دارد. اگر مافیا یکی از آن‌ها را شات کرده باشد، نجات پیدا می‌کند.',
'حرفه\u200cای':'هر شب می‌تواند به یک مافیا شلیک کند؛ اما شلیک اشتباه به شهروند یعنی خروج خودش از بازی.',
'جان سخت':'با شلیک اول مافیا کشته نمی‌شود و از آن بی‌خبر است. استعلام نفرات خارج‌شده با اوست و دو بار می‌تواند استعلام وضعیت بگیرد.',
'شهردار':'فقط یک بار در کل بازی می‌تواند رای‌گیری دور دوم را لغو کند تا کسی خارج نشود، یا یکی از متهم‌ها را بدون رای‌گیری از بازی خارج کند.',
'فروشنده':'یک نفر را در کل بازی انتخاب می‌کند و توانایی او تا آخر بازی از بین می‌رود. اگر جان‌سخت را انتخاب کند و جلیقه‌اش سالم باشد، فقط جلیقه از بین می‌رود و توانایی‌اش می‌ماند.',
'خوابگرد':'یک شب می‌تواند خوابگردی کند. در آن شب مافیا بیدار نمی‌شود و فقط نقش‌های شهروندی بیدار می‌شوند؛ صبح بعد خوابگرد از بازی خارج می‌شود.',
'شهروند':'توانایی ویژه ندارد و فقط در روز با استدلال به پیدا کردن مافیا کمک می‌کند.'
}});
function auto(n){
  const s=cur();if(s.fix)return s.fix.slice();
  const ni=s.I.length,mc=Math.max(1,Math.floor(n/3)+(s.x||0)-ni),sp=n-mc-ni,al=S.all&&s.C.length,k=al?sp:Math.min(s.C.length,sp>=5?sp-1:sp),l=[];
  for(let j=0;j<mc;j++)l.push([s.M[j]||'مافیای ساده','m']);
  s.I.forEach(r=>l.push([r,'i']));
  for(let j=0;j<sp;j++)l.push([al?s.C[j%s.C.length]:(j<k?s.C[j]:'شهروند'),'c']);
  return l;
}
const agg=l=>{const m=new Map();l.forEach(([r,t])=>{const key=r+'|'+t;if(m.has(key))m.get(key).k++;else m.set(key,{r,t,k:1})});return[...m.values()]};
function comp(n){return S.cust?S.cust.flatMap(x=>Array(x.k).fill([x.r,x.t])):auto(n)}
const teamOf=r=>{const s=cur();return s.M.includes(r)?'m':s.I.includes(r)?'i':s.C.includes(r)?'c':((s.fix||[]).find(x=>x[0]===r)||[])[1]||RT[r]||'c'};
function build(){
  const base=comp(S.n);let l,key,t=0,h=[];
  try{h=JSON.parse(localStorage.getItem('mafia-deals')||'[]')}catch(e){}
  do{l=shuffle(base.slice());key=l.map(x=>x[0]).join('|');t++}while(h.includes(key)&&t<500);
  h.push(key);try{localStorage.setItem('mafia-deals',JSON.stringify(h.slice(-10)))}catch(e){}
  S.players=l.map((x,j)=>({name:'بازیکن '+fa(j+1),role:x[0],team:x[1],alive:true}));
  S.i=0;S.shown=false;S.step='reveal';S.night=true;S.round=1;
}
function stat(){
  const a=S.players.filter(p=>p.alive),c=t=>a.filter(p=>p.team===t).length;
  return{m:c('m'),t:c('c'),i:c('i'),total:a.length};
}
function winner(){
  if(cur().man)return null;
  const s=stat();
  if(s.i)return null;
  if(s.m===0)return'شهروندان برنده شدند';
  if(s.m>=s.t)return'مافیا برنده شد';
  return null;
}
function readNames(){document.querySelectorAll('[data-n]').forEach(e=>S.names[+e.dataset.n]=e.value)}
function nightGuide(){
  const al=S.players.filter(p=>p.alive),mf=al.filter(p=>p.team==='m');
  const ix=p=>{const i=NO.indexOf(p.role);return i<0?99:i};
  let h='';
  if(S.round===1)h+=`<div class="step">شب اول: مافیا چشم باز می‌کنند و گرداننده آن‌ها را به هم معرفی می‌کند.</div>`;
  if(mf.length)h+=`<div class="step"><b>مافیا</b>: ${mf.map(p=>esc(p.name)+' ('+p.role+')').join('، ')}<small>مشورت بی‌صدا و انتخاب قربانی</small></div>`;
  al.filter(p=>p.team!=='m'&&p.role!=='شهروند'&&p.role!=='شهروند ساده').sort((a,b)=>ix(a)-ix(b)).forEach(p=>{
    h+=`<div class="step"><b>${p.role}</b>: ${esc(p.name)}<small>${roleDesc(p.role)}</small></div>`});
  return h||'<div class="step">برای این شب نقش بیدارشونده‌ای نیست.</div>';
}
function view(){
  const s=cur();
  if(S.step==='setup'){
    const rows=S.cust||agg(comp(S.n)),tot=rows.reduce((a,x)=>a+x.k,0);if(S.cust)S.n=tot;
    const grp=['m','c','i'].map(t=>{const g=rows.map((x,i)=>({r:x.r,t:x.t,k:x.k,i})).filter(x=>x.t===t);return g.length?`<div class="gh">${tn(t)}</div>`+g.map(x=>`<div class="rl"><span>${x.r}</span><div class="rs"><button class="ghost" data-d="-1" data-i="${x.i}" aria-label="کم کردن ${x.r}">−</button><b>${fa(x.k)}</b><button data-d="1" data-i="${x.i}" aria-label="اضافه کردن ${x.r}">+</button></div></div>`).join(''):''}).join('');
    const have=new Set(rows.map(x=>x.r)),pool=Object.keys(RT).filter(r=>!have.has(r));
    const addo=['m','c','i'].map(t=>{const o=pool.filter(r=>teamOf(r)===t);return o.length?`<optgroup label="${tn(t)}">`+o.map(r=>`<option>${r}</option>`).join('')+'</optgroup>':''}).join('');
    const nm=rows.filter(x=>x.t==='m').reduce((a,x)=>a+x.k,0);
    const panel=`<div class="card"><h2>ترکیب نقش‌ها</h2>
    <button id="all" class="${S.all?'on':'ghost'}">همه‌ی بازیکنان نقش ویژه داشته باشند${S.all?' ✓':''}</button>
    ${S.all&&!S.cust&&!s.fix&&rows.some(x=>x.t==='c'&&x.k>1)?'<p style="margin:8px 0 0">تعداد بازیکنان از نقش‌های سناریو بیشتر است؛ برای همین بعضی نقش‌ها تکرار شده‌اند.</p>':''}
    ${grp}
    <div class="tot"><span>جمع نقش‌ها = تعداد بازیکنان</span><span>${fa(tot)}</span></div>
    ${!s.man&&nm===0?'<p>هیچ نقش مافیایی انتخاب نشده؛ بازی بلافاصله با برد شهروندان تمام می‌شود.</p>':''}
    <select id="addr" aria-label="افزودن نقش"><option value="">+ افزودن نقش…</option>${addo}</select>
    ${S.cust?'<button class="ghost" id="rst">بازگشت به ترکیب پیشنهادی</button>':''}</div>`;
    const gs=[...new Set(SCL.map(x=>x.g))];
    const sel=gs.map(g=>`<optgroup label="${g}">`+SCL.map((x,i)=>x.g===g?`<option value="${i}"${i===S.sc?' selected':''}>${x.n}</option>`:'').join('')+'</optgroup>').join('');
        $.innerHTML=`<div class="hero"><img src="${LOGO}" alt="یاتوق"><h1>مافیا</h1><p>ابزار گرداننده: پخش نقش، ترتیب شب و روز، و اعلام برنده.</p></div>
    <div class="card"><h2>سناریو</h2><select id="sc" aria-label="سناریو">${sel}</select>
    ${s.note?`<p>${s.note}</p>`:''}
    <h2>تعداد بازیکنان</h2><div class="chips">${s.s.map(n=>`<button class="${n===S.n&&!S.cust?'on':'ghost'}" data-sz="${n}">${fa(n)}</button>`).join('')}</div>
    </div>${panel}
    <button id="go">ادامه: آموزش بازی</button>`;
    document.getElementById('sc').onchange=e=>{readNames();S.sc=+e.target.value;S.cust=null;const z=cur().s;if(!z.includes(S.n))S.n=z[Math.floor(z.length/2)];render()};
    document.querySelectorAll('[data-sz]').forEach(b=>b.onclick=()=>{readNames();S.cust=null;S.n=+b.dataset.sz;render()});
    document.getElementById('go').onclick=()=>{S.step='learn';render()};
    const edit=f=>{readNames();const L=S.cust||(S.cust=agg(comp(S.n)));f(L);S.cust=L.filter(x=>x.k>0);S.n=S.cust.reduce((a,x)=>a+x.k,0);render()};
    document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>edit(L=>{const x=L[+b.dataset.i],d=+b.dataset.d;if(d<0&&L.reduce((a,y)=>a+y.k,0)<=3)return;x.k+=d}));
    document.getElementById('addr').onchange=e=>{const r=e.target.value;if(r)edit(L=>{const x=L.find(y=>y.r===r);x?x.k++:L.push({r,t:teamOf(r),k:1})})};
    document.getElementById('all').onclick=()=>{readNames();S.all=!S.all;S.cust=null;render()};
    const rs=document.getElementById('rst');if(rs)rs.onclick=()=>{readNames();S.cust=null;if(!s.s.includes(S.n))S.n=s.s[Math.floor(s.s.length/2)];render()};
  }else if(S.step==='learn'){
    const T=s.tut,rows=agg(comp(S.n));
    const flow=T&&T.flow?`<div class="card"><h2>روند بازی</h2>${T.flow.map(f=>`<div class="step"><b>${f[0]}</b><small>${f[1]}</small></div>`).join('')}</div>`:'';
    const grp=['m','c','i'].map(t=>{const g=rows.filter(x=>x.t===t);return g.length?`<div class="card"><h2>${tn(t)}</h2>`+g.map(x=>`<div class="step"><b>${x.r}${x.k>1?' × '+fa(x.k):''}</b><small>${roleDesc(x.r)}</small></div>`).join('')+'</div>':''}).join('');
    $.innerHTML=`<div class="card"><h2>آموزش: ${s.n}</h2><p>${fa(S.n)} بازیکن. این توضیحات را برای همه‌ی بازیکنان بخوانید؛ بعد نقش‌ها به‌صورت تصادفی پخش می‌شود.</p>${s.note?`<p>${s.note}</p>`:''}${T?'':'<p>آموزش روند این سناریو هنوز اضافه نشده؛ فقط نقش‌ها توضیح داده می‌شوند.</p>'}</div>${flow}${grp}
    <button id="deal">پخش تصادفی نقش‌ها</button><div class="row"><button class="ghost" id="back">بازگشت</button></div>`;
    document.getElementById('deal').onclick=()=>{build();render()};
    document.getElementById('back').onclick=()=>{S.step='setup';render()};
  }else if(S.step==='reveal'){
    const p=S.players[S.i];
    if(!S.shown){
      $.innerHTML=`<div class="card big"><p>گوشی را به این نفر بدهید</p><div class="who">${esc(p.name)}</div><button id="show">دیدن نقش من</button></div>`;
      document.getElementById('show').onclick=()=>{S.shown=true;render()};
    }else{
      const last=S.i===S.players.length-1;
      $.innerHTML=`<div class="card big"><div class="who">${esc(p.name)}</div><div class="role t${p.team}">${p.role}</div><div class="team t${p.team}">${tn(p.team)}</div><p>${roleDesc(p.role)}</p><p>نقش را حفظ کنید و گوشی را پنهان کنید.</p><button id="hide">${last?'شروع بازی':'پنهان کردن و نفر بعدی'}</button></div>`;
      document.getElementById('hide').onclick=()=>{if(last)S.step='game';else{S.i++;S.shown=false}render()};
    }
  }else{
    const w=winner(),st=stat();
    const rows=S.players.map((p,j)=>`<div class="pl ${p.alive?'':'dead'}"><div><input type="text" class="nm nmi" data-pn="${j}" placeholder="${'بازیکن '+fa(j+1)}" value="${p.name==='بازیکن '+fa(j+1)?'':esc(p.name)}" aria-label="نام بازیکن ${fa(j+1)}">${S.peek||!p.alive?`<span class="tag">${p.role}</span>`:''}</div><button class="ghost" data-t="${j}">${p.alive?'حذف':'برگرداندن'}</button></div>`).join('');
    const kiass=!w&&!s.man&&st.total===3&&st.m===1&&!st.i;
    const guide=S.night?`<div class="card"><h2>ترتیب بیدار شدن</h2>${nightGuide()}</div>`
      :`<div class="card"><h2>مراحل روز</h2><ol><li>اعلام کشته‌های شب</li><li>هر بازیکن ۱ تا ۲ دقیقه صحبت می‌کند (بدون اشاره به نقش)</li><li>رای‌گیری: هر کس به اندازه‌ی نصف منهای یک رای بگیرد به دادگاه می‌رود</li><li>دفاع متهمان و رای نهایی</li><li>وصیت بازیکن حذف‌شده</li></ol></div>`;
    $.innerHTML=`<div class="card phase"><b>${S.night?'شب':'روز'} ${fa(S.round)}</b><span class="tag">${fa(st.total)} زنده</span></div>
    ${w?`<div class="card win">${w}</div>`:''}
    ${s.man?`<div class="card">پایان بازی را گرداننده اعلام می‌کند.</div>`:st.i&&!w?`<div class="card">نقش مستقل هنوز در بازی است؛ شرط برد او را گرداننده بررسی می‌کند.</div>`:''}
    ${kiass?`<div class="card"><b>کی‌آس:</b> دو شهروند و یک مافیا مانده‌اند. همه ۱ تا ۳ دقیقه مذاکره می‌کنند و گرداننده نتیجه را اعلام می‌کند.</div>`:''}
    ${guide}
    <div class="card">${rows}</div>
    <div class="row"><button class="ghost" id="peek">${S.peek?'پنهان کردن نقش‌ها':'نمایش نقش‌ها'}</button></div>
    <div class="row"><button id="next">${S.night?'شروع روز':'شروع شب بعد'}</button></div>
    <div class="row"><button class="ghost" id="again">بازی جدید</button></div>`;
    document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const p=S.players[+b.dataset.t];p.alive=!p.alive;render()});
    document.querySelectorAll('[data-pn]').forEach(e=>e.oninput=()=>{const j=+e.dataset.pn;S.players[j].name=e.value.trim()||'بازیکن '+fa(j+1)});
    document.getElementById('peek').onclick=()=>{S.peek=!S.peek;render()};
    document.getElementById('next').onclick=()=>{if(!S.night)S.round++;S.night=!S.night;render()};
    document.getElementById('again').onclick=()=>{S.step='setup';S.peek=false;render()};
  }
}
function render(){
  view();const g=S.step==='game';document.getElementById('tm').style.display=g?'block':'none';document.body.style.paddingBottom=g?'200px':'';if(!g)tmStop();
  if(S.step!=='setup')$.insertAdjacentHTML('afterbegin',`<header class="bar"><span class="gm">سناریوی ${cur().n}</span><img src="${LOGO}" alt="یاتوق"></header>`);
}
const TM={m:'sp',d:{sp:60,ch:30},left:60,run:false,end:0,h:0,ac:null};
const tmFmt=x=>{x=Math.max(0,Math.ceil(x));const m=Math.floor(x/60),r=x%60;return fa(m)+':'+(r<10?fa(0):'')+fa(r)};
function tmDraw(){const t=document.getElementById('tt');t.textContent=tmFmt(TM.left);t.classList.toggle('lo',TM.left<=10&&(TM.run||TM.left<=0));
  document.getElementById('tm-go').textContent=TM.run?'توقف':'شروع';
  ['sp','ch'].forEach(k=>document.getElementById('tm-'+k).className=TM.m===k?'on':'ghost')}
function tmStop(){clearInterval(TM.h);TM.run=false}
function tmSet(m){tmStop();if(m)TM.m=m;TM.left=TM.d[TM.m];tmDraw()}
function tmAdj(d){if(TM.run)return;TM.d[TM.m]=Math.max(10,TM.d[TM.m]+d);TM.left=TM.d[TM.m];tmDraw()}
function tmBeep(){try{navigator.vibrate&&navigator.vibrate([300,150,300,150,500])}catch(e){}
  try{const a=TM.ac;if(!a)return;[0,.35,.7].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.2,a.currentTime+t);o.start(a.currentTime+t);o.stop(a.currentTime+t+.25)})}catch(e){}}
function tmTick(){TM.left=(TM.end-Date.now())/1000;if(TM.left<=0){TM.left=0;tmStop();tmBeep()}tmDraw()}
document.getElementById('tm-sp').onclick=()=>tmSet('sp');
document.getElementById('tm-ch').onclick=()=>tmSet('ch');
document.getElementById('tm-rs').onclick=()=>tmSet();
document.getElementById('tm-m').onclick=()=>tmAdj(-10);
document.getElementById('tm-p').onclick=()=>tmAdj(10);
document.getElementById('tm-go').onclick=()=>{
  if(TM.run){TM.left=(TM.end-Date.now())/1000;tmStop();tmDraw();return}
  try{TM.ac=TM.ac||new(window.AudioContext||window.webkitAudioContext)();TM.ac.resume&&TM.ac.resume()}catch(e){}
  if(TM.left<=0)TM.left=TM.d[TM.m];
  TM.end=Date.now()+TM.left*1000;TM.run=true;TM.h=setInterval(tmTick,200);tmDraw()};
render();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
